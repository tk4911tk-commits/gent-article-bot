name: Weekly GENT Article Topic Bot

on:
  schedule:
    - cron: '0 11 * * 0'
  workflow_dispatch:

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install axios dotenv

      - name: Generate topics and send to LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node src/weekly-topic-generator.js

      - name: Commit topic history back to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/topic-history.json logs/
          git diff --staged --quiet || git commit -m "Update topic history [skip ci]"
          git push

      - name: Log execution
        run: echo "Weekly topic pool generated and sent to LINE"
